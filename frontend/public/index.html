<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#E05A78" />
        <meta name="description" content="Projeto Faculdade — gestão da clínica de beleza e bem-estar" />
        <meta name="application-name" content="Projeto Faculdade" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
        <title>Projeto Faculdade</title>
        <script>
          document.title = "Projeto Faculdade";
          window.addEventListener("error", function (e) {
            if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
        </script>
    </head>
    <body>
        <noscript>Você precisa habilitar o JavaScript para usar este app.</noscript>
        <div id="root"></div>
    </body>
</html>
