# Configurações do Spring Boot para produção.
server.address=0.0.0.0
server.port=${PORT:8080}

# Configurações do banco de dados.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Configurações do JWT.
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# Configurações de autenticação.

app.auth.allow-legacy-passwords=false
# Configurações do Springdoc.

springdoc.api-docs.enabled=falseework.web=INFO
logging.level.faculdade=INFO
